name: Convert MARP README to HTML

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: "Find README files with marp: true"
        id: find_readmes
        run: |
          readmes=$(find . -name 'README.md' -exec grep -l '^---\s*\nmarp:\s*true' {} \; || echo "")
          echo "readmes=$readmes" >> $GITHUB_OUTPUT
          mkdir -p build

      - name: Process Marp README files
        if: steps.find_readmes.outputs.readmes != ''
        run: |
          for file in ${{ steps.find_readmes.outputs.readmes }}; do
            dir=$(dirname "$file")
            basename=$(basename "$file" .md)
            mkdir -p "build/$dir"
            
            # Copy any images directory if it exists
            if [[ -d "$dir/img" ]]; then
              mkdir -p "build/$dir/img"
              cp -R "$dir/img"/* "build/$dir/img/"
            fi

            echo "Processing $file to HTML, PDF, and PPTX..."
          done

      - name: Generate HTML files
        if: steps.find_readmes.outputs.readmes != ''
        uses: docker://marpteam/marp-cli:v3.0.2
        with:
          args: ${{ steps.find_readmes.outputs.readmes }} -o ./build --html
        env:
          MARP_USER: root:root

      - name: Generate PDF files
        if: steps.find_readmes.outputs.readmes != ''
        uses: docker://marpteam/marp-cli:v3.0.2
        with:
          args: ${{ steps.find_readmes.outputs.readmes }} -o ./build --pdf --allow-local-files
        env:
          MARP_USER: root:root

      - name: Generate PPTX files
        if: steps.find_readmes.outputs.readmes != ''
        uses: docker://marpteam/marp-cli:v3.0.2
        with:
          args: ${{ steps.find_readmes.outputs.readmes }} -o ./build --pptx --allow-local-files
        env:
          MARP_USER: root:root

      - name: Deploy preview
        if: ${{ github.event_name == 'pull_request' && steps.find_readmes.outputs.readmes != '' }}
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./build/
          preview-branch: gh-pages
          umbrella-dir: pr-preview

      - name: Deploy production
        if: ${{ github.event_name == 'push' && steps.find_readmes.outputs.readmes != '' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./build/
          clean-exclude: pr-preview/