name: Convert MARP README to HTML

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Find README files
        id: find_readmes
        run: |
          files=$(find . -name 'README.md' -exec grep -l 'marp: true' {} \;)
          echo "files=$files" >> $GITHUB_OUTPUT

      - name: Convert README files to HTML
        if: steps.find_readmes.outputs.files != ''
        run: |
          for file in ${{ steps.find_readmes.outputs.files }}; do
            marp --html "$file" -o "${file%.md}.html"
          done

      - name: Upload HTML files
        if: steps.find_readmes.outputs.files != ''
        uses: actions/upload-artifact@v3
        with:
          name: html-files
          path: '**/*.html'