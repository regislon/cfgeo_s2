name: Convert MARP README to HTML

# Configuration - specify the markdown files to convert
env:
  MARP_FILES: >-
    general/README.md
    general/github.md
    base_donnees/readme.md

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: "Check if specified Markdown files exist"
        id: find_readmes
        run: |
          echo "Using specified Markdown files for conversion:"
          
          # Create an array of files from the environment variable
          IFS=$'\n' read -r -d '' -a markdown_files < <(echo "${{ env.MARP_FILES }}" | tr ' ' '\n' && printf '\0')
          
          valid_files=""
          for file in "${markdown_files[@]}"; do
            if [[ -n "$file" && -f "$file" ]]; then
              echo "Found file: $file"
              valid_files+="$file"$'\n'
            else
              echo "Warning: File not found: $file"
            fi
          done
          
          # Remove trailing newline
          valid_files=$(echo "$valid_files" | sed -e 's/\n$//')
          
          if [ -z "$valid_files" ]; then
            echo "No valid Markdown files found"
            echo "readmes=" >> $GITHUB_OUTPUT
          else
            echo "Found the following valid Markdown files:"
            echo "$valid_files"
            echo "readmes<<EOF" >> $GITHUB_OUTPUT
            echo "$valid_files" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
          mkdir -p build

      # Instead of copying directories first, we'll process each file individually to maintain structure
      - name: Process Marp README files individually
        if: steps.find_readmes.outputs.readmes != ''
        run: |
          for file in ${{ steps.find_readmes.outputs.readmes }}; do
            dir=$(dirname "$file")
            basename=$(basename "$file" .md)
            output_dir="build/$dir"
            
            # Create directory structure
            mkdir -p "$output_dir"
            
            # Copy any images directory if it exists
            if [[ -d "$dir/img" ]]; then
              mkdir -p "$output_dir/img"
              cp -R "$dir/img"/* "$output_dir/img/"
            fi
            
            # Copy referenced images from the Markdown file
            echo "Copying images referenced in $file..."
            grep -oE '!\[.*\]\(([^)]+)\)' "$file" | sed -E 's/!\[.*\]\(([^)]+)\)/\1/' | while read -r image; do
              if [[ -f "$dir/$image" ]]; then
                mkdir -p "$output_dir/$(dirname "$image")"
                cp "$dir/$image" "$output_dir/$image"
              fi
            done
            
            echo "Processing $file in $dir to maintain folder structure..."
            
            # Generate HTML
            docker run --rm -e MARP_USER=root:root -v $PWD:/home/marp/app/ marpteam/marp-cli:v3.0.2 "$file" -o "$output_dir/$basename.html" --html
            
            # Generate PDF
            docker run --rm -e MARP_USER=root:root -v $PWD:/home/marp/app/ marpteam/marp-cli:v3.0.2 "$file" -o "$output_dir/$basename.pdf" --pdf --allow-local-files
            
            # Generate PPTX
            docker run --rm -e MARP_USER=root:root -v $PWD:/home/marp/app/ marpteam/marp-cli:v3.0.2 "$file" -o "$output_dir/$basename.pptx" --pptx --allow-local-files
            
            # For directories that contain a README.md that is being processed, also copy the HTML version as index.html
            if [[ "$basename" == "README" ]]; then
              cp "$output_dir/$basename.html" "$output_dir/index.html"
            fi
          done

      - name: Deploy preview
        if: ${{ github.event_name == 'pull_request' && steps.find_readmes.outputs.readmes != '' }}
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./build/
          preview-branch: gh-pages
          umbrella-dir: pr-preview

      - name: Deploy production
        if: ${{ github.event_name == 'push' && steps.find_readmes.outputs.readmes != '' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./build/
          clean-exclude: pr-preview/