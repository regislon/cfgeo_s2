<p><img src="image-37.png" alt="alt text" /></p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="106" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="106" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="exercice--calcul-de-distance-entre-deux-villes-los-angeles-et-paris">Exercice : Calcul de distance entre deux villes (Los Angeles et Paris)</h2>
<p>Quelle est la distance entre Los Angeles et Paris en utilisant <code>ST_Distance(geography, geography)</code> ?</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> ST_Distance(
   <span class="hljs-comment">-- Los Angeles (LAX)</span>
   <span class="hljs-string">&#x27;SRID=4326;POINT(-118.4079 33.9434)&#x27;</span>::geography,
   <span class="hljs-comment">-- Paris (CDG)</span>
   <span class="hljs-string">&#x27;SRID=4326;POINT(2.5559 49.0083)&#x27;</span>::geography
);
</code></pre>
<p>Résultat : <strong>9124665 mètres</strong> (~9125 km)</p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="107" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="107" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<ul>
<li>La fonction <code>ST_Distance</code> appliquée à des objets de type <code>geography</code> retourne la distance sphéroïdale en mètres.</li>
<li>Pratique pour des calculs de distances réelles à l’échelle mondiale.</li>
</ul>
<p><img src="image-38.png" alt="" style="height:400px;" /></p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="108" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="108" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h1 id="quel-est-litin%C3%A9raire-le-plus-court-de-los-angeles-%C3%A0-tokyo">Quel est l'itinéraire le plus court de Los Angeles à Tokyo ?</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Distance en degrés (plan)</span>
<span class="hljs-keyword">SELECT</span> ST_Distance(
   <span class="hljs-string">&#x27;SRID=4326;POINT(-118.408 33.943)&#x27;</span>::geometry, <span class="hljs-comment">-- LAX</span>
   <span class="hljs-string">&#x27;SRID=4326;POINT(139.733 35.567)&#x27;</span>::geometry   <span class="hljs-comment">-- NRT</span>
);

<span class="hljs-comment">-- Distance sphéroïdale en mètres (terre)</span>
<span class="hljs-keyword">SELECT</span> ST_Distance(
   <span class="hljs-string">&#x27;SRID=4326;POINT(-118.408 33.943)&#x27;</span>::geography, <span class="hljs-comment">-- LAX</span>
   <span class="hljs-string">&#x27;SRID=4326;POINT(139.733 35.567)&#x27;</span>::geography   <span class="hljs-comment">-- NRT</span>
);
</code></pre>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="109" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="109" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<ul>
<li>Avec <code>geometry</code>, la distance est calculée sur un plan (en degrés).</li>
<li>Avec <code>geography</code>, la distance est calculée sur la sphère (en mètres), ce qui correspond à la distance réelle la plus courte (orthodromie).</li>
</ul>
<p><img src="image-39.png" alt="" style="height:400px;" /></p>
<footer>CFGEO - S2 - 2025</footer>
</section>

<header>Base de données spatiales</header>
<h1 id="conclusion--partie-5">Conclusion — Partie 5</h1>
<ul>
<li>Les bases de données spatiales permettent de stocker, interroger et analyser efficacement des données géographiques.</li>
<li>PostGIS enrichit PostgreSQL avec des types, fonctions et index spatiaux puissants.</li>
<li>Les concepts avancés (jointures spatiales, projections, conversions de formats) sont essentiels pour des analyses précises et reproductibles.</li>
<li>La maîtrise de ces outils ouvre la voie à des applications SIG avancées, collaboratives et évolutives.</li>
</ul>
