</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="5" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="pourquoi-une-base-de-donn%C3%A9es-en-g%C3%A9omatique">Pourquoi une base de données en géomatique ?</h2>
<ul>
<li>Gérer de grands volumes de données spatiales</li>
<li>Garantir l’intégrité, la cohérence et la traçabilité</li>
<li>Faciliter les requêtes spatiales complexes</li>
<li>Travailler en équipe, sur des données partagées</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="6" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="fichiers-g%C3%A9ographiques-vs-base-de-donn%C3%A9es">Fichiers géographiques vs base de données</h2>
<table>
<thead>
<tr>
<th>Fichiers SIG (ex: Shapefile, GeoPackage)</th>
<th>Base de données (PostGIS)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Stockage local</td>
<td>Stockage centralisé</td>
</tr>
<tr>
<td>Accès séquentiel</td>
<td>Requêtes dynamiques (SQL)</td>
</tr>
<tr>
<td>Limité pour la mise à jour multi-utilisateur</td>
<td>Collaboration simplifiée</td>
</tr>
<tr>
<td>Pas d’index spatial performant</td>
<td>Index spatial performant</td>
</tr>
</tbody>
</table>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="7" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p><img src="image-3.png" alt="" style="height:400px;" /></p>
<p>source : <a href="https://medium.com/@tjukanov/why-should-you-care-about-postgis-a-gentle-introduction-to-spatial-databases-9eccd26bc42b">https://medium.com/@tjukanov/why-should-you-care-about-postgis-a-gentle-introduction-to-spatial-databases-9eccd26bc42b</a></p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="8" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p>La majorité de la diffusion des données géographiques s’effectue via des bases de données. Toutefois, les données statiques, pour des raisons de performance, sont souvent diffusées sous forme de fichiers tuilés, comme le format MBTiles, par exemple.</p>
<p>De nouveaux formats, tels que GeoParquet, permettent désormais un enregistrement efficace et une accessibilité accrue sans nécessiter de base de données ni de serveur de diffusion. Nous y reviendrons plus en détail dans la suite du cours.</p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="9" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="les-principaux-sgbd-spatiaux">Les principaux SGBD spatiaux</h2>
<ul>
<li><strong>PostgreSQL/PostGIS</strong> : open source, très utilisé en géomatique, riche en fonctions spatiales.</li>
<li><strong>Oracle Spatial</strong> : solution propriétaire, très puissante, intégrée à Oracle Database.</li>
<li><strong>Microsoft SQL Server (avec extension spatiale)</strong> : supporte les types geometry et geography, utilisé dans de nombreux environnements professionnels.</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="10" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<ul>
<li><strong>MySQL (Spatial Extensions)</strong> : supporte les objets géométriques, moins avancé que PostGIS ou Oracle.</li>
<li><strong>SpatiaLite</strong> : extension spatiale pour SQLite, idéale pour des usages légers ou embarqués.</li>
<li><strong>MongoDB (GeoJSON)</strong> : base NoSQL avec support des requêtes spatiales simples.</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="11" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="12" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="historique-de-postgresql">Historique de PostgreSQL</h2>
<ul>
<li><strong>1986</strong> : Début du projet POSTGRES à l’Université de Californie, Berkeley, sous la direction de Michael Stonebraker (suite au projet Ingres).</li>
<li><strong>1996</strong> : Le projet devient PostgreSQL, ajout du support SQL.</li>
<li><strong>Années 2000</strong> : Adoption croissante dans le monde open source et en entreprise, enrichissement des fonctionnalités (transactions, index avancés, extensibilité).</li>
<li><strong>Aujourd’hui</strong> : PostgreSQL est reconnu comme l’un des SGBD open source les plus robustes, évolutifs et riches en fonctionnalités, avec une forte communauté et de nombreux contributeurs.</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="13" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="%F0%9F%98%B2-fun-facts"><img class="emoji" draggable="false" alt="😲" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f632.svg" data-marp-twemoji=""/> Fun facts</h2>
<p>PostgreSQL se prononce souvent &quot;Post-Gress&quot;, car le nom complet est un peu tordu pour beaucoup. C’est la contraction de POSTGRES (Post-Ingres) et SQL. Même les développeurs du projet disent que c’est OK de dire juste &quot;Postgres&quot;.</p>
<p><img class="emoji" draggable="false" alt="🐘" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f418.svg" data-marp-twemoji=""/> Le logo de PostgreSQL est un éléphant- Pourquoi ? Parce qu’un éléphant a une excellente mémoire, tout comme une base de données fiable. Le logo s'appelle Slonik, et certains outils comme pgBackRest ou pgAdmin l’utilisent aussi.</p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="14" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="historique-de-postgis">Historique de PostGIS</h2>
<ul>
<li><strong>2001</strong> : Début du développement de PostGIS par Refractions Research pour ajouter des capacités spatiales à PostgreSQL.</li>
<li><strong>2003</strong> : Première version stable (1.0), ajout des types <code>geometry</code> et des fonctions spatiales de base.</li>
<li><strong>2005</strong> : Certification OGC (Open Geospatial Consortium) pour la conformité avec les standards spatiaux.</li>
<li><strong>Années 2010</strong> : Intégration de nouvelles fonctionnalités comme le support des types <code>geography</code>, des index GiST améliorés, et des fonctions avancées (ST_Cluster, ST_3D).</li>
<li><strong>Aujourd’hui</strong> : PostGIS est l’une des extensions spatiales les plus utilisées, avec un large écosystème d’outils compatibles (QGIS, GeoServer, etc.).</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="15" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p><strong>PostGIS &amp; Spatial Database History</strong></p>
<p><a href="https://www.youtube.com/watch?v=ZO5ZAXtW0MU">https://www.youtube.com/watch?v=ZO5ZAXtW0MU</a></p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="16" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="postgresql--postgis">PostgreSQL + PostGIS</h2>
<ul>
<li>
<p><strong>PostgreSQL</strong> : Système de gestion de base de données relationnelle (SGBDR)</p>
</li>
<li>
<p><strong>PostGIS</strong> : Extension spatiale de PostgreSQL</p>
<ul>
<li>Ajoute le type <code>geometry</code> et <code>geography</code></li>
<li>Fonctions spatiales : distances, intersections, buffers, etc.</li>
<li>Indexation spatiale avec <strong>GiST</strong></li>
</ul>
</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="17" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="%F0%9F%98%B2-fun-facts-1"><img class="emoji" draggable="false" alt="😲" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f632.svg" data-marp-twemoji=""/> Fun facts</h2>
<ol>
<li>
<p><strong>PostGIS est conforme aux standards OGC</strong><br />
Cela veut dire qu’il respecte les règles internationales définies pour le traitement de données géographiques. Un must pour l’interopérabilité !</p>
</li>
<li>
<p><strong>Des fonctions spatiales à gogo</strong><br />
PostGIS propose plus de <strong>600 fonctions</strong> spatiales. Tu peux faire un <code>ST_Intersects</code>, <code>ST_Buffer</code>, <code>ST_Distance</code>, <code>ST_Within</code>, etc. C’est comme faire du QGIS dans une base de données.</p>
</li>
<li>
<p><strong>Utilisé par des agences spatiales ! <img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f680.svg" data-marp-twemoji=""/></strong><br />
PostGIS est utilisé dans des projets de traitement de données <strong>satellitaires</strong>, par exemple à l’<strong>ESA</strong> (European Space Agency) ou dans des portails de données géographiques comme <strong>GeoServer</strong>.</p>
</li>
</ol>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="18" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<ol start="4">
<li>
<p><strong>Il peut gérer le monde entier</strong><br />
Grâce à son support de projections multiples et de géométries complexes, PostGIS peut stocker et analyser des données à l’échelle <strong>globale</strong>, tout en étant rapide et efficace.</p>
</li>
<li>
<p><strong>Il a un plugin pour la 3D et le raster !</strong><br />
PostGIS ne se limite pas aux vecteurs : tu peux stocker et manipuler des <strong>surfaces 3D</strong> (<code>TIN</code>, <code>PolyhedralSurface</code>) et des <strong>images raster géoréférencées</strong>. Tu peux même faire des calculs NDVI dans ta base !</p>
</li>
</ol>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="19" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="le-mod%C3%A8le-relationnel--spatial">Le modèle relationnel + spatial</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> <span class="hljs-keyword">TABLE</span> batiments (
  id SERIAL <span class="hljs-keyword">PRIMARY</span> KEY,
  nom TEXT,
  geom GEOMETRY(POLYGON, <span class="hljs-number">2056</span>)
);
</code></pre>
<ul>
<li>Chaque ligne représente un <strong>objet géographique</strong></li>
<li>La colonne <code>geom</code> contient la <strong>géométrie</strong></li>
<li>Le SRID (ex: 2056) indique le <strong>système de projection</strong></li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="20" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="requ%C3%AAtes-spatiales-avec-postgis">Requêtes spatiales avec PostGIS</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Rechercher tous les bâtiments dans une zone</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> batiments
<span class="hljs-keyword">WHERE</span> ST_Within(geom, ST_GeomFromText(<span class="hljs-string">&#x27;POLYGON(...)&#x27;</span>, <span class="hljs-number">2056</span>));
</code></pre>
<ul>
<li>Requêtes puissantes grâce aux fonctions <code>ST_</code></li>
<li>Compatible avec QGIS, GeoServer, etc.</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="21" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="index-spatial--acc%C3%A9l%C3%A9rer-les-requ%C3%AAtes">Index spatial : accélérer les requêtes</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> INDEX batiments_geom_idx
<span class="hljs-keyword">ON</span> batiments
<span class="hljs-keyword">USING</span> GIST(geom);
</code></pre>
<ul>
<li>L’index GiST permet des recherches rapides</li>
<li>Obligatoire pour les projets de grande envergure</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="22" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="int%C3%A9gration-sig--bdd">Intégration SIG + BDD</h2>
<ul>
<li>QGIS peut se connecter directement à PostGIS</li>
<li>Possibilité d’éditer, visualiser et filtrer les données</li>
<li>Un seul lieu de vérité pour toutes les équipes</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="23" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p><strong>Qgis est-il le seul à pouvoir se connecter à PostGIS ?</strong></p>
<p>Non, d'autres outils comme Pgadmin, GeoServer, MapServer, et même des langages de programmation comme Python (avec psycopg2) ou R (avec RPostgreSQL) peuvent se connecter à PostGIS.</p>
<footer>CFGEO - S2 - 2025</footer>
</section>

<header>Base de données spatiales</header>
<h2 id="quest-ce-que-pgadmin">Qu'est-ce que PgAdmin ?</h2>
<p>PgAdmin est un outil graphique open source pour gérer et administrer les bases de données PostgreSQL. Il offre une interface utilisateur intuitive pour :</p>
<ul>
<li>Créer, modifier et supprimer des bases de données, tables, et autres objets.</li>
<li>Exécuter des requêtes SQL et visualiser les résultats.</li>
<li>Gérer les utilisateurs et les permissions.</li>
<li>Superviser les performances et surveiller l'activité de la base de données.</li>
</ul>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/26a0.svg" data-marp-twemoji=""/> : PgAdmin n'est pas une base de données, mais un outil graphique pour adminsiter la base de données.</p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="25" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="r%C3%A9sum%C3%A9">Résumé</h2>
<ul>
<li>PostGIS transforme PostgreSQL en base spatiale puissante</li>
<li>Idéal pour des projets collaboratifs et évolutifs</li>
<li>Remplace avantageusement les fichiers plats (shapefile, etc.)</li>
<li>Outil central dans une <strong>Infrastructure de Données Spatiales (IDS)</strong></li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>

<h2 id="proc%C3%A9dure-dinstallation-de-postgresql-postgis-et-pgadmin">Procédure d'installation de PostgreSQL, PostGIS et PgAdmin</h2>
<h3 id="1-installation-de-postgresql">1. Installation de PostgreSQL</h3>
<ol>
<li>Rendez-vous sur le site officiel de PostgreSQL : <a href="https://www.postgresql.org/download/">https://www.postgresql.org/download/</a>.</li>
<li>Sélectionnez votre système d'exploitation (Windows).</li>
<li>Téléchargez et installez le programme d'installation approprié.</li>
</ol>
<ul>
<li>Configurez un mot de passe pour l'utilisateur <code>postgres</code>.</li>
<li>Notez le port par défaut (5432) et le chemin d'installation.</li>
</ul>
<p><img class="emoji" draggable="false" alt="📺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f4fa.svg" data-marp-twemoji=""/> <strong>Consultez la vidéo d'installation <code>base_donnees/video/install.mkv</code> si nécessaire.</strong></p>

<header>Base de données spatiales</header>

<ol>
<li>Téléchargez PgAdmin depuis <a href="https://www.pgadmin.org/download/">https://www.pgadmin.org/download/</a>.</li>
<li>Installez le logiciel en suivant les instructions pour votre système d'exploitation.</li>
<li>Lancez PgAdmin et connectez-vous à votre instance PostgreSQL en utilisant les informations configurées lors de l'installation.</li>
</ol>
<footer>CFGEO - S2 - 2025</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="31" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h3 id="2-installation-de-postgis">2. Installation de PostGIS</h3>
<p>Depuis PgAdmin, dans le menu <strong>Tools &gt; Query Tool</strong>, exécutez les commandes suivantes :</p>
<ol>
<li>Installez PostGIS via l'outil de gestion des extensions :</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> EXTENSION postgis;
</code></pre>
<ol start="2">
<li>Vérifiez que PostGIS est bien installé :</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> PostGIS_Full_Version();
</code></pre>
<footer>CFGEO - S2 - 2025</footer>
</section>

<p><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Exercice : nous allons créer une nouvelle base de données et ajouter une table avec différentes géométries<br />

<header>Base de données spatiales</header>
<ol>
<li>Exécuter la requête SQL suivante dans PgAdmin pour créer une nouvelle table.</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> <span class="hljs-keyword">TABLE</span> geometries (name <span class="hljs-type">varchar</span>, geom geometry);

<span class="hljs-keyword">INSERT</span> <span class="hljs-keyword">INTO</span> geometries <span class="hljs-keyword">VALUES</span>
  (<span class="hljs-string">&#x27;Point&#x27;</span>, <span class="hljs-string">&#x27;POINT(0 0)&#x27;</span>),
  (<span class="hljs-string">&#x27;Linestring&#x27;</span>, <span class="hljs-string">&#x27;LINESTRING(0 0, 1 1, 2 1, 2 2)&#x27;</span>),
  (<span class="hljs-string">&#x27;Polygon&#x27;</span>, <span class="hljs-string">&#x27;POLYGON((0 0, 1 0, 1 1, 0 1, 0 0))&#x27;</span>),
  (<span class="hljs-string">&#x27;PolygonWithHole&#x27;</span>, <span class="hljs-string">&#x27;POLYGON((0 0, 10 0, 10 10, 0 10, 0 0),(1 1, 1 2, 2 2, 2 1, 1 1))&#x27;</span>),
  (<span class="hljs-string">&#x27;Collection&#x27;</span>, <span class="hljs-string">&#x27;GEOMETRYCOLLECTION(POINT(2 0),POLYGON((0 0, 1 0, 1 1, 0 1, 0 0)))’);

</span></code></pre>

<h1 id="partie-4--acc%C3%A8s-%C3%A0-la-base-de-donn%C3%A9es-depuis-votre-ordinateur-personnel">Partie 4 : Accès à la base de données depuis votre ordinateur personnel</h1>
<p>Situation actuelle :</p>
<p><img src="image-18.png" alt="" style="height:400px;" /></p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="43" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p>Il est possible d’accéder à la base de données PostgreSQL/PostGIS depuis votre ordinateur personnel, en utilisant un outil comme <strong>PgAdmin</strong>. Cela vous permet de gérer vos données géographiques sans avoir à vous connecter à la machine virtuelle à chaque fois.</p>
<p><img src="image-19.png" alt="" style="height:400px;" /></p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="44" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p><strong>Préparez-vous, car quelques configurations seront nécessaires si vous souhaitez accéder à la base à distance :</strong></p>
<ul>
<li>Il faudra configurer <strong>PostgreSQL</strong> pour qu’il accepte les connexions distantes.</li>
<li>Il faudra également modifier le <strong>pare-feu de la machine virtuelle</strong> pour autoriser les connexions sur le port <strong>5432</strong>.</li>
<li>Enfin, il sera nécessaire d’ajuster les <strong>groupes de sécurité AWS</strong> afin d’ouvrir ce même port.</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="45" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p>Pour ce faire, il vous suffit de suivre les étapes suivantes :</p>
<ol>
<li><strong>Téléchargez et installez PgAdmin</strong> sur votre PC personel.</li>
<li><strong>Ouvrir les ports de la machine virtuelle</strong> pour permettre l'accès à PostgreSQL depuis l'extérieur (voir ci-après).</li>
<li><strong>Connectez-vous à la machine virtuelle</strong> depuis PgAdmin en utilisant l'adresse IP de la VM et le port 5432.</li>
<li><strong>Créez une nouvelle connexion</strong> dans PgAdmin en utilisant l'adresse IP de la VM, le port 5432, le nom d'utilisateur <code>postgres</code> et le mot de passe que vous avez défini lors de l'installation.</li>
<li><strong>Testez la connexion</strong> pour vous assurer que tout fonctionne correctement.</li>
</ol>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="46" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="installer-pgadmin-sur-votre-ordinateur-personnel">Installer PgAdmin sur votre ordinateur personnel</h2>
<p><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Exercice : Installer PgAdmin sur votre ordinateur personnel<br />
<img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Instructions : voir procédure pour le machine virtuelle<br />
<img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/23f1.svg" data-marp-twemoji=""/> Durée estimée : 5 minutes</p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="47" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="ouverture-des-ports-de-la-machine-virtuelle-depuis-la-console-aws">Ouverture des ports de la machine virtuelle depuis la console AWS</h2>
<p><img class="emoji" draggable="false" alt="📺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f4fa.svg" data-marp-twemoji=""/> <strong>Consultez la vidéo d'installation <code>base_donnees/video/aws_security.mkv</code> si nécessaire.</strong></p>
<ol>
<li>Connectez-vous à votre console AWS.</li>
<li>Accédez à la section <strong>EC2</strong>.</li>
<li>Sélectionnez votre instance EC2.</li>
<li>Cliquez sur l'onglet <strong>Security Groups</strong>.</li>
<li>Cliquez sur le groupe de sécurité associé à votre instance.</li>
<li>Cliquez sur l'onglet <strong>Inbound rules</strong>.</li>
<li>Cliquez sur <strong>Edit inbound rules</strong>.</li>
<li>Cliquez sur <strong>Add rule</strong>.</li>
</ol>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="48" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<ol start="9">
<li>Sélectionnez <strong>PostgreSQL</strong> dans le menu déroulant.</li>
<li>Vérifiez que le port 5432 est sélectionné.</li>
<li>Dans le champ <strong>Source</strong>, sélectionnez <strong>My IP</strong> pour autoriser uniquement votre adresse IP ou <strong>Anywhere</strong> pour autoriser toutes les adresses IP (moins sécurisé).</li>
<li>Cliquez sur <strong>Save rules</strong> pour enregistrer les modifications.</li>
<li>Attendez quelques secondes pour que les modifications prennent effet.</li>
<li>Testez la connexion depuis PgAdmin en utilisant l'adresse IP publique (Public IPv4 DNS) de votre instance EC2 et le port 5432.</li>
</ol>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="49" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="%E2%9C%85-ouvrir-le-port-5432-pour-postgresql-sur-windows-server-2022-interface-en-anglais"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/2705.svg" data-marp-twemoji=""/> Ouvrir le port 5432 pour PostgreSQL sur Windows Server 2022 (interface en anglais)</h2>
<ol>
<li>
<p><strong>Ouvrir le pare-feu</strong></p>
<ul>
<li>Clique sur le menu <strong>Start</strong>, puis cherche <strong>&quot;Windows Defender Firewall with Advanced Security&quot;</strong> et ouvre-le.</li>
</ul>
</li>
<li>
<p><strong>Créer une nouvelle règle entrante</strong></p>
<ul>
<li>Dans le panneau de gauche, clique sur <strong>Inbound Rules</strong>.</li>
<li>Dans le panneau de droite, clique sur <strong>New Rule…</strong>.</li>
</ul>
</li>
<li>
<p><strong>Choisir le type de règle</strong></p>
<ul>
<li>Sélectionne <strong>Port</strong> puis clique sur <strong>Next</strong>.</li>
</ul>
</li>
</ol>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="50" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<ol start="4">
<li>
<p><strong>Configurer le port</strong></p>
<ul>
<li>Choisis <strong>TCP</strong>.</li>
<li>Coche <strong>Specific local ports</strong> et saisis : <code>5432</code></li>
<li>Clique sur <strong>Next</strong>.</li>
</ul>
</li>
<li>
<p><strong>Définir l’action</strong></p>
<ul>
<li>Sélectionne <strong>Allow the connection</strong>.</li>
<li>Clique sur <strong>Next</strong>.</li>
</ul>
</li>
<li>
<p><strong>Choisir les profils</strong></p>
<ul>
<li>Coche les options appropriées : <strong>Domain</strong>, <strong>Private</strong> et éventuellement <strong>Public</strong> si nécessaire.</li>
<li>Clique sur <strong>Next</strong>.</li>
</ul>
</li>
</ol>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="51" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<ol start="7">
<li>
<p><strong>Nommer la règle</strong></p>
<ul>
<li>Donne un nom clair, comme : <code>PostgreSQL - Port 5432</code></li>
<li>Clique sur <strong>Finish</strong>.</li>
</ul>

</ol>
<footer>CFGEO - S2 - 2025</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="52" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">

<h3 id="%F0%9F%94%A7-configuration-de-postgresql-sur-windows-server-2022"><img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f527.svg" data-marp-twemoji=""/> Configuration de PostgreSQL sur Windows Server 2022</h3>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="53" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h1 id="partie-5--partie-th%C3%A9orique-concepts-avanc%C3%A9s">Partie 5 : Partie théorique, concepts avancés</h1>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="54" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="partie-5--concepts-avanc%C3%A9s--panorama">Partie 5 : Concepts avancés — Panorama</h2>
<p>Dans cette partie, nous allons approfondir les concepts clés des bases de données spatiales :</p>
<ul>
<li><strong>Types de géométrie</strong> : points, lignes, polygones, collections, 3D, etc.</li>
<li><strong>Indexation spatiale</strong> : accélérer les requêtes grâce aux index (GiST, R-Tree).</li>
<li><strong>Requêtes spatiales</strong> : sélection, mesure, relations spatiales (intersection, inclusion, distance…).</li>
<li><strong>Jointures spatiales</strong> : relier des tables selon la position ou la relation géographique de leurs objets.</li>
<li><strong>Systèmes de coordonnées</strong> : importance du SRID et des projections pour la précision des calculs.</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="55" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p>Les base de données spatiales fournissent de nouveaux types de données afin de modéliser les géométries</p>
<p><img src="image-13.png" alt="" style="width:600px;" /></p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="56" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p>Les base de données spatiales ont des index spatiaux</p>
<p><img src="image-14.png" alt="" style="height:400px;" /></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> INDEX mytable_geom <span class="hljs-keyword">ON</span> mytable <span class="hljs-keyword">USING</span> GIST (geom);
</code></pre>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="57" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p><img src="image-15.png" alt="" style="height:200px;" /></p>
<p>Dans la figure ci-dessus, le nombre de lignes qui coupent l'étoile jaune est de un, la ligne rouge. Mais les boîtes englobantes des éléments qui coupent la boîte jaune sont au nombre de deux, la rouge et la bleue.</p>
<p>La façon dont la base de données répond efficacement à la question &quot;quelles lignes coupent l'étoile jaune&quot; est de répondre d'abord à la question &quot;quelles boîtes coupent la boîte jaune&quot; en utilisant l'index (ce qui est très rapide), puis de faire un calcul exact de &quot;quelles lignes coupent l'étoile jaune&quot; uniquement pour les objets retournés par le premier test.</p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="58" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p>Pour une grande table, ce système de &quot;deux passes&quot; consistant à évaluer d'abord l'index approximatif, puis à effectuer un test exact peut réduire radicalement la quantité de calculs nécessaires pour répondre à une requête.</p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="59" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;--marpit-advanced-background-split:35%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="left"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;image-16.png&quot;);background-size:300px auto;"></figure></div></section></foreignObject><foreignObject width="65%" height="720" x="35%"><section id="59" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="59" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;--marpit-advanced-background-split:35%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<header>Base de données spatiales</header>

<p>Ce <strong>R-Tree</strong> organise les objets spatiaux de manière à ce qu’une recherche spatiale soit une promenade rapide dans l’arbre.</p>
<p>Pour trouver quel objet contient <img class="emoji" draggable="false" alt="🌸" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f338.svg" data-marp-twemoji=""/> :</p>
<ul>
<li>Le système vérifie d’abord s’il est dans <strong>T</strong> ou <strong>U</strong> (<strong>T</strong>).</li>
<li>Il vérifie ensuite s’il se trouve dans <strong>N</strong>, <strong>P</strong> ou <strong>Q</strong> (<strong>P</strong>).</li>
<li>Il vérifie enfin s’il se trouve dans <strong>C</strong>, <strong>D</strong> ou <strong>E</strong> (<strong>D</strong>).</li>
</ul>
<p>Seulement <strong>8 cases</strong> doivent être testées.<br />
Pour un balayage complet de la table, il faudrait tester <strong>13 cases</strong>.<br />
Plus la table est grande, plus l’index est <strong>puissant</strong>.</p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="59" data-marpit-pagination-total="112" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="left"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="60" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="left"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;image-20.png&quot;);background-size:500px auto;"></figure></div></section></foreignObject><foreignObject width="60%" height="720" x="40%"><section id="60" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="60" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<header>Base de données spatiales</header>

<p>POSTGIS offre quatre types spatiaux principaux</p>
<ul>
<li>Geometry : type planaire basé sur les mathématiques cartésiennes (éléments : points, lignes, polygones, ...).</li>
<li>Geography : type géodésique sphéroïdal (des lignes et des polygones sont dessinés sur une surface courbe).</li>
<li>Topology : type de modèle relationnel. Les objets sont représentés comme un réseau de nœuds et d'arêtes.</li>
<li>Raster : l'espace est modélisé comme une grille de cellules rectangulaires, chacune contenant une valeur numérique</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="60" data-marpit-pagination-total="112" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="left"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="61" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h3 id="points">Points</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> <span class="hljs-keyword">TABLE</span> myPoints (
   id SERIAL <span class="hljs-keyword">PRIMARY</span> KEY,
   description <span class="hljs-type">VARCHAR</span>(<span class="hljs-number">10</span>),
   point GEOMETRY(POINT),
   <span class="hljs-number">3</span>dpoint GEOMETRY(POINTZ),
   pointsrd GEOMETRY(POINT, <span class="hljs-number">4326</span>)
);

</code></pre>
<ul>
<li><strong>POINT</strong> → un point dans l’espace 2D avec des coordonnées (X,Y)</li>
<li><strong>POINTZ</strong> → un point dans l’espace 3D avec des coordonnées (X,Y,Z)</li>
<li><strong>POINTM</strong> → un point dans l’espace 2D avec une valeur mesurée (M)</li>
<li><strong>POINTZM</strong> → un point dans l’espace 3D avec une valeur mesurée (M)</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="62" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h3 id="lignes--polygones">Lignes / Polygones</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> <span class="hljs-keyword">TABLE</span> geometries (name <span class="hljs-type">varchar</span>, geom geometry);

<span class="hljs-keyword">INSERT</span> <span class="hljs-keyword">INTO</span> geometries <span class="hljs-keyword">VALUES</span>
  (<span class="hljs-string">&#x27;Point&#x27;</span>, <span class="hljs-string">&#x27;POINT(0 0)&#x27;</span>),
  (<span class="hljs-string">&#x27;Linestring&#x27;</span>, <span class="hljs-string">&#x27;LINESTRING(0 0, 1 1, 2 1, 2 2)&#x27;</span>),
  (<span class="hljs-string">&#x27;Polygon&#x27;</span>, <span class="hljs-string">&#x27;POLYGON((0 0, 1 0, 1 1, 0 1, 0 0))&#x27;</span>),
  (<span class="hljs-string">&#x27;PolygonWithHole&#x27;</span>, <span class="hljs-string">&#x27;POLYGON((0 0, 10 0, 10 10, 0 10, 0 0),
                               (1 1, 1 2, 2 2, 2 1, 1 1))&#x27;</span>),
  (<span class="hljs-string">&#x27;Collection&#x27;</span>, <span class="hljs-string">&#x27;GEOMETRYCOLLECTION(POINT(2 0)),
                POLYGON((0 0, 1 0, 1 1, 0 1, 0 0)))&#x27;</span>);


</code></pre>
<ul>
<li><strong>LINESTRING</strong> → une ligne composée de plusieurs points en 2D (coordonnées X,Y)</li>
<li><strong>LINESTRINGZ</strong> → une ligne en 3D (coordonnées X,Y,Z)</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="63" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<ul>
<li><strong>LINESTRINGM</strong> → une ligne en 2D avec une valeur mesurée (M) à chaque point</li>
<li><strong>LINESTRINGZM</strong> → une ligne en 3D avec une valeur mesurée (M) à chaque point</li>
<li><strong>POLYGON</strong> → une surface fermée définie par un ou plusieurs anneaux en 2D</li>
<li><strong>MULTIPOINT</strong> → un ensemble de points indépendants</li>
<li><strong>MULTIPOLYGON</strong> → un ensemble de polygones distincts</li>
<li><strong>GEOMETRYCOLLECTION</strong> → une collection hétérogène de géométries (points, lignes, polygones, etc.)</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>

<header>Base de données spatiales</header>
<h3 id="autre-types-de-g%C3%A9om%C3%A9trie">Autre types de géométrie</h3>

<ul>
<li><strong>POLYHEDRALSURFACE</strong> : surface 3D composée de plusieurs faces polygonales.</li>
<li><strong>TIN</strong> : réseau de triangles pour modéliser des surfaces irrégulières (topographie).</li>
<li><strong>CIRCULARSTRING</strong> : courbe définie par des arcs de cercle.</li>
<li><strong>COMPOUNDCURVE</strong> : combinaison de segments linéaires et de courbes.</li>
<li><strong>CURVEPOLYGON</strong> : polygone dont les bords peuvent être des courbes.</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="64" data-marpit-pagination-total="112" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="left"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-marpit-fragments="4" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="65" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h3 id="%E2%9C%85-fonctions-de-construction-de-g%C3%A9om%C3%A9tries"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/2705.svg" data-marp-twemoji=""/> Fonctions de construction de géométries :</h3>
<ul>
<li data-marpit-fragment="1"><strong>ST_GeomFromText</strong> → Build geometries from well-known text</li>
<li data-marpit-fragment="2"><strong>ST_GeomFromWKB</strong> → Build geometries from a binary representation</li>
<li data-marpit-fragment="3"><strong>ST_GeomFromGeoJSON</strong> → Build geometries from a GEOJSON format</li>
<li data-marpit-fragment="4"><strong>ST_GeomFromKML</strong> → Build geometries from a KML format</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="66" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h3 id="%E2%9C%85-exemple-sql"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/2705.svg" data-marp-twemoji=""/> Exemple SQL :</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> <span class="hljs-keyword">TABLE</span> cities (
  id int4 <span class="hljs-keyword">primary</span> key,
  name <span class="hljs-type">varchar</span>(<span class="hljs-number">50</span>),
  the_geom geometry(POINT, <span class="hljs-number">4326</span>)
);

<span class="hljs-keyword">INSERT</span> <span class="hljs-keyword">INTO</span> cities (id, the_geom, name) <span class="hljs-keyword">VALUES</span>
  (<span class="hljs-number">1</span>, ST_GeomFromText(<span class="hljs-string">&#x27;POINT(-0.1257 51.508)&#x27;</span>, <span class="hljs-number">4326</span>), <span class="hljs-string">&#x27;London, England&#x27;</span>),
  (<span class="hljs-number">2</span>, ST_GeomFromText(<span class="hljs-string">&#x27;POINT(-81.233 42.983)&#x27;</span>, <span class="hljs-number">4326</span>), <span class="hljs-string">&#x27;London, Ontario&#x27;</span>),
  (<span class="hljs-number">3</span>, ST_GeomFromText(<span class="hljs-string">&#x27;POINT(27.91162491 -33.01529)&#x27;</span>, <span class="hljs-number">4326</span>), <span class="hljs-string">&#x27;East London, SA&#x27;</span>);
</code></pre>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="67" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> cities;
</code></pre>
<p>Résultat :</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code> id |       name        |                      the_geom
----+-------------------+--------------------------------------------------------------
 1  | London, England   | 0101000020E6100000BBB88D06F016C0BF1B2FDD2406C14940
 2  | London, Ontario   | 0101000020E6100000F4FDD478E94E54C0E7FBA9F1D27D4540
 3  | East London, SA   | 0101000020E610000040AB064060E93B4059FAD005F58140C0

La colonne <code>the_geom</code> affiche une <strong>représentation binaire spatiale</strong> (WKB : Well-Known Binary).</p>

<header>Base de données spatiales</header>
<h2 id="visualiser-la-g%C3%A9om%C3%A9trie-dans-pgadmin">Visualiser la géométrie dans PgAdmin</h2>
<p>Depuis PgAdmin, il est possible de visualiser les géométries directement dans l'interface :</p>
<ol>
<li>Faites un clic droit sur la table contenant la colonne géométrique, puis sélectionnez <strong>View/Edit Data &gt; All Rows</strong>.</li>
<li>Dans la colonne <code>geom</code>, cliquez sur l'icône en forme de globe ou de loupe pour ouvrir le visualiseur de géométrie intégré.</li>
<li>Vous pouvez ainsi explorer et vérifier la représentation spatiale de vos données sans quitter PgAdmin.</li>
</ol>
<p>Cette fonctionnalité est très pratique pour un contrôle rapide des objets spatiaux insérés ou modifiés dans la base.</p>
<footer>CFGEO - S2 - 2025</footer>
</section>

<header>Base de données spatiales</header>
<h1 id="charger-des-donn%C3%A9es-g%C3%A9ographiques-dans-postgresql">Charger des données géographiques dans PostgreSQL</h1>
<p>Plusieurs outils permettent d'importer des données spatiales dans PostgreSQL/PostGIS :</p>
<ul>
<li><strong>ogr2ogr</strong> (GDAL) : conversion et import de nombreux formats (Shapefile, GeoJSON, etc.)</li>
<li><strong>shp2pgsql</strong> : conversion de Shapefile en SQL pour PostGIS</li>
<li><strong>SQL</strong> : insertion directe via requêtes SQL</li>
<li><strong>Logiciels SIG</strong> (QGIS, ArcGIS) : connexion et import/export de données</li>
<li><strong>ETL</strong> (FME, Talend) : flux de transformation et chargement avancés</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="77" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p>Exemple avec <code>ogr2ogr</code> :</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">ogr2ogr \
   -f <span class="hljs-string">&quot;PostgreSQL&quot;</span> \
   PG:<span class="hljs-string">&quot;host=localhost dbname=nyc user=postgres password=secret&quot;</span> \
   nyc_census_blocks_2000.shp \
   -nln nyc_census_blocks_2000 \
   -lco GEOMETRY_NAME=geom \
   -lco FID=gid \
   -lco PRECISION=NO
</code></pre>
<ul>
<li><code>-nln</code> : nom de la nouvelle table</li>
<li><code>-lco GEOMETRY_NAME</code> : nom de la colonne géométrique</li>
<li><code>-lco FID</code> : nom de la clé primaire</li>
<li><code>-lco PRECISION</code> : précision des coordonnées</li>
</ul>
<p>Pour plus de détails, voir la <a href="https://gdal.org/programs/ogr2ogr.html">documentation GDAL/ogr2ogr</a>.</p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="78" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="fonctions-de-conversion-de-g%C3%A9om%C3%A9trie-dans-postgis">Fonctions de conversion de géométrie dans PostGIS</h2>
<table>
<thead>
<tr>
<th>Catégorie</th>
<th>Fonctions principales</th>
<th>Formats pris en charge</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Export (ST_As)</strong></td>
<td><code>ST_AsText</code>, <code>ST_AsEWKT</code>, <code>ST_AsGeoJSON</code>, <code>ST_AsGML</code>, <code>ST_AsKML</code>, <code>ST_AsSVG</code>, <code>ST_AsBinary</code></td>
<td>WKT, EWKT, GeoJSON, GML, KML, SVG, WKB</td>
</tr>
<tr>
<td><strong>Import (ST_GeomFrom)</strong></td>
<td><code>ST_GeomFromText</code>, <code>ST_GeomFromEWKT</code>, <code>ST_GeomFromGeoJSON</code>, <code>ST_GeomFromGML</code>, <code>ST_GeomFromKML</code>, <code>ST_GeomFromWKB</code></td>
<td>WKT, EWKT, GeoJSON, GML, KML, WKB</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>ST_As...</strong> : Convertit une géométrie PostGIS vers un format texte ou binaire.</li>
<li><strong>ST_GeomFrom...</strong> : Crée une géométrie PostGIS à partir d'un format texte ou binaire.</li>
</ul>
<p>Exemple :</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> ST_AsGeoJSON(geom), ST_AsText(geom) <span class="hljs-keyword">FROM</span> ma_table;
</code></pre>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="79" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">

<p>Exercice : Calculer la superficie d'un quartier</p>
<p><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Exercice : Quelle est la superficie du quartier &quot;West Village&quot; ?<br />
<img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Instructions : Google + CHatGPT + <a href="https://postgis.net/docs/ST_Area.html">https://postgis.net/docs/ST_Area.html</a><br />
<img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/23f1.svg" data-marp-twemoji=""/> Durée estimée : 10 minutes</p>
<footer>CFGEO - S2 - 2025</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="81" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p>Exercice : Calculer la longueur d'une rue</p>
<p><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Exercice : Quelle est la longueur de la rue &quot;Pelham St&quot; ?<br />
<img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Instructions : Utilisez la documentation PostGIS, notamment la fonction <a href="https://postgis.net/docs/ST_Length.html">ST_Length</a>, pour écrire une requête SQL qui calcule la longueur de &quot;Pelham St&quot; dans la table des rues importée.<br />

<header>Base de données spatiales</header>
<h2 id="relations-spatiales--calcul-de-distances">Relations spatiales : calcul de distances</h2>
<p>PostGIS propose plusieurs fonctions pour mesurer la distance entre objets géographiques :</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Distance euclidienne (plan)</span>
<span class="hljs-keyword">SELECT</span> ST_Distance(geom1, geom2);

<span class="hljs-comment">-- Distance sphérique (terre sphérique)</span>
<span class="hljs-keyword">SELECT</span> ST_DistanceSphere(geom1, geom2);

<span class="hljs-comment">-- Distance sphéroïdale (terre ellipsoïdale)</span>
<span class="hljs-keyword">SELECT</span> ST_DistanceSpheroid(geom1, geom2, <span class="hljs-string">&#x27;SPHEROID[&quot;WGS 84&quot;,6378137,298.257223563]&#x27;</span>);
</code></pre>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="86" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p>Exemple pratique :</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> p1.name, p2.name,
   ST_DistanceSphere(p1.the_geom, p2.the_geom) <span class="hljs-keyword">AS</span> st_distance_sphere
<span class="hljs-keyword">FROM</span> cities <span class="hljs-keyword">AS</span> p1, cities <span class="hljs-keyword">AS</span> p2
<span class="hljs-keyword">WHERE</span> p1.id <span class="hljs-operator">&gt;</span> p2.id;
</code></pre>

<p><img src="image-30.png" alt="" style="height:400px;" /></p>
<p>Source : <a href="http://postgis.net/workshops/postgis-intro/spatial_relationships.html">http://postgis.net/workshops/postgis-intro/spatial_relationships.html</a></p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="88" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="fonctions-de-relations-spatiales-principales">Fonctions de relations spatiales principales</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Intersections</span>
<span class="hljs-keyword">SELECT</span> ST_Intersects(geomA, geomB);

<span class="hljs-comment">-- Intersection géométrique</span>
<span class="hljs-keyword">SELECT</span> ST_Intersection(geomA, geomB);

<span class="hljs-comment">-- Inclusion</span>
<span class="hljs-keyword">SELECT</span> ST_Within(geomA, geomB);

<span class="hljs-comment">-- Contient</span>
<span class="hljs-keyword">SELECT</span> ST_Contains(geomA, geomB);


<span class="hljs-comment">-- Chevauchement</span>
<span class="hljs-keyword">SELECT</span> ST_Overlaps(geomA, geomB);

</code></pre>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="89" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql">
<span class="hljs-comment">-- Toucher</span>
<span class="hljs-keyword">SELECT</span> ST_Touches(geomA, geomB);


<span class="hljs-comment">-- Égalité géométrique</span>
<span class="hljs-keyword">SELECT</span> ST_Equals(geomA, geomB);
</code></pre>
<ul>
<li>Ces fonctions permettent de comparer des objets spatiaux et de filtrer selon leurs relations (intersection, inclusion, contact, etc.).</li>
<li>Disponibles pour les types <code>geometry</code> et <code>geography</code>.</li>
<li>Très utilisées pour les requêtes spatiales avancées (ex: trouver les objets qui se touchent ou s’intersectent).</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="90" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">

<header>Base de données spatiales</header>
<h2 id="jointures-spatiales">Jointures spatiales</h2>
<p>Les jointures spatiales permettent de relier des tables en fonction de la relation géographique entre leurs objets, plutôt que sur une clé classique.</p>
<ul>
<li>Exemple : associer chaque station de métro au quartier dans lequel elle se trouve.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> s.name <span class="hljs-keyword">AS</span> station, q.name <span class="hljs-keyword">AS</span> quartier
<span class="hljs-keyword">FROM</span> stations s
<span class="hljs-keyword">JOIN</span> quartiers q
   <span class="hljs-keyword">ON</span> ST_Within(s.geom, q.geom);
</code></pre>
<ul>
<li>Fonctions courantes : <code>ST_Within</code>, <code>ST_Intersects</code>, <code>ST_DWithin</code>, etc.</li>
<li>Très utile pour croiser des couches géographiques (ex : points dans polygones, lignes traversant polygones).</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="95" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="95" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="98" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="98" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="exercice--analyse-spatiale-et-donn%C3%A9es-attributaires">Exercice : Analyse spatiale et données attributaires</h2>
<p><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Exercice :<br />
Après le 11 septembre, le quartier de Battery Park a été interdit d'accès pendant plusieurs jours. Combien de personnes ont dû être évacuées ?</p>
<p><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Instructions :</p>
<ul>
<li>Identifiez le quartier &quot;Battery Park&quot; dans la table des quartiers.</li>
<li>Recherchez le champ correspondant à la population (par exemple <code>population</code> ou similaire).</li>
<li>Écrivez une requête SQL pour obtenir le nombre d'habitants à évacuer.</li>
</ul>
<p><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/23f1.svg" data-marp-twemoji=""/> Durée estimée : 5 minutes</p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="99" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="99" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p>Exercice : Trouver le quartier avec la plus forte densité de population</p>
<p><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Exercice :<br />
Quel quartier a la plus forte densité de population (personnes/km²) ?</p>
<p><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Instructions :</p>
<ul>
<li>Identifiez les champs correspondant à la population et à la géométrie des quartiers.</li>
<li>Utilisez la fonction <a href="https://postgis.net/docs/ST_Area.html">ST_Area</a> pour calculer la superficie de chaque quartier.</li>
<li>Calculez la densité en divisant la population par la superficie (en km²).</li>
<li>Écrivez une requête SQL pour trouver le quartier ayant la densité maximale.</li>
</ul>
<p><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/svg/23f1.svg" data-marp-twemoji=""/> Durée estimée : 10 minutes</p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="100" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="100" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="syst%C3%A8mes-de-coordonn%C3%A9es-g%C3%A9ographiques">Systèmes de coordonnées géographiques</h2>
<ul>
<li>Un <strong>système de coordonnées</strong> permet de localiser précisément des objets dans l’espace.</li>
<li>Deux grands types :
<ul>
<li><strong>Cartésien (plan)</strong> : coordonnées (X, Y), utilisées pour des plans locaux ou des projections planes.</li>
<li><strong>Sphérique (géodésique)</strong> : coordonnées (longitude, latitude, éventuellement altitude), adaptées à la surface de la Terre.</li>
</ul>
</li>
<li>Le choix du système de coordonnées influence la précision des mesures spatiales (distances, surfaces, etc.).</li>
<li>En base de données spatiale, chaque géométrie est associée à un <strong>SRID</strong> (Spatial Reference System Identifier) qui définit son système de coordonnées.</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="101" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="101" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p><img src="image-34.png" alt="alt text" /></p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="102" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="102" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="calculer-la-distance-entre-los-angeles-et-paris">Calculer la distance entre Los Angeles et Paris</h2>
<p>Quelle est la distance entre Los Angeles et Paris en utilisant <code>ST_Distance(geometry, geometry)</code> ?</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> ST_Distance(
   <span class="hljs-string">&#x27;SRID=4326;POINT(-118.4079 33.9434)&#x27;</span>::geometry,
   <span class="hljs-string">&#x27;SRID=4326;POINT(2.5559 49.0083)&#x27;</span>::geometry
);
</code></pre>
<p>Résultat (en degrés) : <strong>121.90</strong></p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="103" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="103" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<p>Pour obtenir la distance en mètres (sur la sphère) :</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> ST_DistanceSphere(
   <span class="hljs-string">&#x27;SRID=4326;POINT(-118.4079 33.9434)&#x27;</span>::geometry,
   <span class="hljs-string">&#x27;SRID=4326;POINT(2.5559 49.0083)&#x27;</span>::geometry
);
</code></pre>
<p>Résultat : <strong>9105587.6 mètres</strong> (~9106 km)</p>
<p><img src="image-35.png" alt="alt text" /></p>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="104" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="104" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
<header>Base de données spatiales</header>
<h2 id="les-unit%C3%A9s-de-mesure-spatiales">Les unités de mesure spatiales</h2>
<ul>
<li>Les <strong>degrés</strong> (°) ne sont pas des unités de distance ou de surface, mais des unités angulaires.</li>
<li>La distance représentée par 1° de longitude varie selon la latitude :
<ul>
<li>À l’équateur : ~111,3 km</li>
<li>À 60° de latitude : ~55,8 km</li>
</ul>
</li>
<li>Pour obtenir des distances ou surfaces réelles, utilisez des fonctions adaptées (<code>ST_DistanceSphere</code>, <code>ST_Area</code> avec projection métrique).</li>
<li>Toujours vérifier le <strong>SRID</strong> et le système de coordonnées de vos données avant de faire des calculs spatiaux.</li>
</ul>
<footer>CFGEO - S2 - 2025</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="105" data-paginate="true" data-header="Base de données spatiales" data-footer="CFGEO - S2 - 2025" data-theme="default" data-marpit-pagination="105" data-marpit-pagination-total="112" style="--paginate:true;--header:Base de données spatiales;--footer:CFGEO - S2 - 2025;--theme:default;">
